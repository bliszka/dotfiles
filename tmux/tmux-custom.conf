# My tmux settings on top of Omarchy's ~/.config/tmux/tmux.conf.
#
# This file lives in ~/dotfiles. Omarchy's tmux.conf loads it with one line at
# its end (install.sh adds it), so these values win:
#   source-file -q ~/dotfiles/tmux/tmux-custom.conf
# Omarchy updates and `omarchy refresh tmux` may rewrite tmux.conf and drop
# that line. Run ~/dotfiles/install.sh to add it again.
#
# Omarchy's tmux.conf already sets: prefix C-Space (+ C-b), splits on
# prefix h / v and Alt+Enter / Alt+Shift+Enter, extended keys (CSI-u, so
# Shift+Enter reaches apps as a soft newline) and the OSC 52 clipboard.
# Only my changes go here.

# Status bar: refresh every 2 s for the CPU widget; CPU and date on the right.
set -g status-interval 2
set -g status-right "#[fg=blue]#{?pane_in_mode,COPY ,}#{?client_prefix,PREFIX ,}#{?window_zoomed_flag,ZOOM ,}#[fg=brightblack]#h #[default] #{cpu_fg_color}CPU: #{cpu_icon} #{cpu_percentage}#[default] | %h-%d %H:%M"

# Plugins (TPM). install.sh clones TPM and installs the rest;
# by hand: prefix + I.
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-cpu'

set -g @cpu_low_fg_color "#[fg=green]"
set -g @cpu_medium_fg_color "#[fg=yellow]"
set -g @cpu_high_fg_color "#[fg=red]"

set -g @cpu_low_icon ""
set -g @cpu_medium_icon ""
set -g @cpu_high_icon ""

# TPM must run last.
run '~/.config/tmux/plugins/tpm/tpm'
